<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Eli Laba — Cinematographer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --ink:#fff; --mute:#9b9b9b; --line:#232323; --accent:#e8a24a;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html{scroll-behavior:smooth;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(1.25rem,4vw,2.5rem)}

/* Nav appears once the opening has faded */
nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:env(safe-area-inset-top,0px) 0 0;background:linear-gradient(to bottom,rgba(0,0,0,.92),rgba(0,0,0,0));opacity:0;pointer-events:none;transition:opacity .6s ease}
nav.show{opacity:1;pointer-events:auto}
nav .in{display:flex;justify-content:space-between;align-items:baseline;max-width:1160px;margin:0 auto;padding:1.25rem clamp(1.25rem,4vw,2.5rem)}
nav .links{display:flex;gap:1.75rem;font-size:.95rem}
nav a{text-decoration:none;color:var(--mute)}
nav a:hover{color:var(--ink)}
nav a.me{font-family:var(--serif);font-size:1.35rem;color:var(--ink)}

/* Opening: name, role, reel */
.opening{padding:env(safe-area-inset-top,0px) clamp(1.25rem,4vw,2.5rem) 7rem;will-change:opacity}
.title{min-height:44svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 0 2rem}
.title h1{margin:0;font:400 clamp(3.2rem,12vw,9.5rem)/.95 var(--serif);color:#fff;letter-spacing:-.015em;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
.title .sub{margin:1.1rem 0 0;font-size:clamp(1rem,2vw,1.35rem);letter-spacing:.12em;text-indent:.12em;color:#bdbdbd;animation:rise 1.4s .25s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reel{max-width:1100px;margin:0 auto;aspect-ratio:16/9;background:#050505;position:relative;overflow:hidden;animation:rise 1.4s .5s cubic-bezier(.2,.7,.2,1) both}
.reel iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.reel .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-decoration:none;color:#cfcfcf;background:radial-gradient(60% 80% at 70% 40%,rgba(232,162,74,.18),transparent 65%),linear-gradient(120deg,#080808,#161a1f);font-size:.95rem}
.reel .ph .play{width:4.5rem;height:4.5rem;border:1px solid rgba(255,255,255,.55);border-radius:50%;display:grid;place-items:center;transition:border-color .25s,transform .25s}
.reel .ph .play::after{content:"";margin-left:.3rem;border-left:1.1rem solid #fff;border-top:.7rem solid transparent;border-bottom:.7rem solid transparent}
.reel a.ph:hover .play{border-color:var(--accent);transform:scale(1.05)}

/* Projects */
h2{font:400 clamp(1.8rem,3.5vw,2.6rem)/1.1 var(--serif);margin:0 0 2rem}
#work{padding-top:2rem}
.work{display:grid;grid-template-columns:repeat(2,1fr);gap:3rem 2rem;padding-bottom:5rem}
.work .wide{grid-column:1/-1}
.work a{text-decoration:none;display:block}
.frame{position:relative;overflow:hidden;background-size:cover;background-position:center;border-radius:2px;transition:transform .35s ease}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.35),transparent 45%)}
.work a:hover .frame{transform:scale(.985)}
.work h3{margin:.9rem 0 .15rem;font:400 1.6rem/1.2 var(--serif)}
.work h3 span{color:var(--mute);font-size:1rem}
.work .meta{margin:0;color:var(--mute);font-size:.92rem}
.work .ar{display:inline-block;margin-right:.6rem;color:var(--accent);font-weight:500}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:3rem;padding:3rem 0 5rem;border-top:1px solid var(--line)}
.cols p{margin:0 0 1rem;max-width:34em;font-family:var(--serif);font-size:1.2rem;line-height:1.55}
.cols .lead{font-size:1.5rem;line-height:1.35;color:#fff}
dl{margin:0;display:grid;grid-template-columns:8.5rem 1fr;gap:.7rem 1rem;font-size:.95rem}
dt{color:var(--mute)} dd{margin:0}
.contact{border-top:1px solid var(--line);padding:3rem 0 4rem;display:flex;justify-content:space-between;gap:2rem;flex-wrap:wrap;align-items:end}
.contact a.big{font:400 clamp(1.8rem,5vw,3.4rem)/1.1 var(--serif);text-decoration-thickness:1px;text-underline-offset:.2em}
.contact a.big:hover{color:var(--accent)}
.contact small{color:var(--mute)}
.contact small a:hover{color:var(--ink)}
@media (max-width:760px){
  .cols{grid-template-columns:1fr;gap:1.75rem}
  .work{grid-template-columns:1fr}
  nav .links{gap:1rem}
  .opening{padding-bottom:5rem}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .title h1,.title .sub,.reel{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
  .frame,nav{transition:none}
}
</style>
</head>
<body>
<nav id="nav" aria-label="Main">
  <div class="in">
    <a class="me" href="#top" id="navName">Eli Laba</a>
    <div class="links"><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></div>
  </div>
</nav>

<header class="opening" id="top">
  <div class="title">
    <h1 id="name">Eli Laba</h1>
    <p class="sub" id="role">Cinematographer</p>
  </div>
  <div class="reel" id="reel" role="region" aria-label="Demo reel"></div>
</header>

<main class="wrap">
  <section id="work" aria-labelledby="wt">
    <h2 id="wt" class="reveal">Selected work</h2>
    <div class="work" id="grid"></div>
  </section>

  <section class="cols" id="about">
    <div><h2>About</h2><p class="lead" id="intro"></p><div id="about-text"></div></div>
    <div><h2>Kit and credits</h2><dl id="kit"></dl></div>
  </section>

  <footer class="contact" id="contact">
    <div>
      <p style="margin:0 0 .5rem" id="avail"></p>
      <a class="big" id="email" href="#"></a>
    </div>
    <small><span id="copy"></span> &nbsp; <a id="ig" href="#" target="_blank" rel="noopener">Instagram</a> &nbsp; <a id="vm" href="#" target="_blank" rel="noopener">Vimeo</a></small>
  </footer>
</main>

<script>
// All content lives in projects.json. You should not need to edit this file.
var fallbacks = [
  "radial-gradient(50% 80% at 25% 55%,#e9b06a,transparent 60%),linear-gradient(120deg,#1a2b33,#38535a 60%,#6b7d78)",
  "radial-gradient(45% 70% at 70% 30%,#7fb3c8,transparent 65%),linear-gradient(160deg,#0b1620,#1d3a4c)",
  "radial-gradient(40% 60% at 50% 70%,#d9577a,transparent 65%),linear-gradient(180deg,#140c1c,#2c1a38)",
  "radial-gradient(60% 60% at 30% 30%,#f2d9a0,transparent 60%),linear-gradient(140deg,#3a5568,#8aa0ac)"
];
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, text, cls){ var e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
function setImage(frame, src, fallback){
  frame.style.backgroundImage = fallback;
  if (!src) return;
  var img = new Image();
  img.onload = function(){ frame.style.backgroundImage = "url('" + src + "')"; };
  img.src = src;
}
function setLink(id, url){ var a = document.getElementById(id); if (url) a.href = url; else a.style.display = "none"; }

// Turns a Vimeo or YouTube link into an embeddable player URL (null if it isn't a specific video).
function embedUrl(u){
  if (!u) return null;
  var m = u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([a-f0-9]+))?/i);
  if (m) return "https://player.vimeo.com/video/" + m[1] + "?dnt=1" + (m[2] ? "&h=" + m[2] : "");
  m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (m) return "https://www.youtube-nocookie.com/embed/" + m[1] + "?rel=0";
  return null;
}
function buildReel(box, url){
  var src = embedUrl(url);
  if (src){
    var f = document.createElement("iframe");
    f.src = src; f.title = "Demo reel"; f.loading = "lazy";
    f.allow = "autoplay; fullscreen; picture-in-picture"; f.allowFullscreen = true;
    box.appendChild(f);
    return;
  }
  var ph = url ? el("a", "", "ph") : el("div", "", "ph");
  if (url){ ph.href = url; ph.target = "_blank"; ph.rel = "noopener"; }
  ph.append(el("span", "", "play"), el("span", url ? "Watch the demo reel" : "Demo reel coming soon"));
  box.appendChild(ph);
}

// Opening fades out as the reel scrolls away; projects fade in as they enter.
function setupScroll(){
  var opening = document.getElementById("top"), reel = document.getElementById("reel"), nav = document.getElementById("nav");
  var ticking = false;
  function update(){
    ticking = false;
    var vh = window.innerHeight, b = reel.getBoundingClientRect().bottom;
    var start = vh * 0.55, end = vh * 0.05;
    var t = reduced ? (b < end ? 1 : 0) : Math.min(1, Math.max(0, (start - b) / (start - end)));
    if (!reduced) opening.style.opacity = String(1 - t);
    opening.style.visibility = (t >= 1 && !reduced) ? "hidden" : "visible";
    nav.classList.toggle("show", t > 0.5);
  }
  function req(){ if (!ticking){ ticking = true; requestAnimationFrame(update); } }
  window.addEventListener("scroll", req, {passive:true});
  window.addEventListener("resize", req);
  update();
}
function setupReveal(){
  var items = document.querySelectorAll(".reveal");
  if (reduced || !("IntersectionObserver" in window)){ items.forEach(function(n){ n.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, {rootMargin:"0px 0px -12% 0px", threshold:0.05});
  items.forEach(function(n){ io.observe(n); });
}

fetch("projects.json").then(function(r){ return r.json(); }).then(function(d){
  var s = d.site || {};
  var name = s.name || "Eli Laba", role = s.role || "Cinematographer";
  document.title = name + " — " + role;
  document.getElementById("name").textContent = name;
  document.getElementById("navName").textContent = name;
  document.getElementById("role").textContent = role;
  buildReel(document.getElementById("reel"), s.reel);

  var grid = document.getElementById("grid");
  (d.projects || []).forEach(function(p, i){
    var a = el("a", "", "reveal" + (p.wide ? " wide" : ""));
    a.href = p.link || "#"; a.target = "_blank"; a.rel = "noopener";
    var f = el("div", "", "frame");
    f.style.aspectRatio = (p.ar || 1.78) + " / 1";
    f.setAttribute("role", "img"); f.setAttribute("aria-label", "Still from " + p.title);
    setImage(f, p.image, fallbacks[i % fallbacks.length]);
    var h = el("h3", p.title + " "); h.appendChild(el("span", p.year || ""));
    var m = el("p", "", "meta");
    m.append(el("span", (p.ar || 1.78).toFixed(2) + ":1", "ar"), (p.role || "") + (p.tech ? ", " + p.tech : ""));
    a.append(f, h, m); grid.appendChild(a);
  });

  document.getElementById("intro").textContent = s.intro || "";
  var about = document.getElementById("about-text");
  (s.about || []).forEach(function(t){ about.appendChild(el("p", t)); });
  var kit = document.getElementById("kit");
  Object.keys(s.kit || {}).forEach(function(k){ kit.append(el("dt", k), el("dd", s.kit[k])); });

  document.getElementById("avail").textContent = s.availability || "";
  var em = document.getElementById("email"); em.textContent = s.email || ""; em.href = "mailto:" + (s.email || "");
  setLink("ig", s.instagram); setLink("vm", s.vimeo);
  document.getElementById("copy").textContent = "© " + new Date().getFullYear() + " " + name;

  setupScroll();
  setupReveal();
}).catch(function(){
  buildReel(document.getElementById("reel"), null);
  document.getElementById("grid").textContent = "Could not load projects.json. Check that the file is in the same folder as index.html and that its JSON is valid.";
  setupScroll();
});
</script>
</body>
</html>
